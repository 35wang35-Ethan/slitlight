<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>隙光｜內容管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f4f1ed;color:#302923}.login{min-height:100vh;display:grid;place-items:center}.card{border:0;border-radius:18px;box-shadow:0 20px 60px #3b30201b}.form-control{padding:.8rem}textarea{min-height:120px}</style>
</head>
<body>
  <div id="login" class="login"><form class="card p-5" style="width:min(430px,92vw)" id="loginForm"><p class="text-secondary small mb-1">SEAM OF LIGHT</p><h1 class="h3 mb-4">內容管理登入</h1><label class="form-label">管理帳號</label><input class="form-control mb-3" id="user" required><label class="form-label">密碼</label><input class="form-control mb-4" id="pass" type="password" required><button class="btn btn-dark w-100 py-3">登入後台</button></form></div>
  <main id="dashboard" class="container py-5 d-none"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-secondary small mb-1">SEAM OF LIGHT</p><h1 class="h3">網站內容管理</h1></div><div><a class="btn btn-outline-dark me-2" href="index.html" target="_blank">預覽網站</a><button class="btn btn-dark" form="cmsForm">儲存</button></div></div><form id="cmsForm"><section class="card p-4"><label class="form-label">主標題</label><textarea class="form-control mb-3" name="heroTitle"></textarea><label class="form-label">說明文字</label><textarea class="form-control mb-3" name="heroText"></textarea><label class="form-label">按鈕文字</label><input class="form-control mb-3" name="cta"><div class="row g-3"><div class="col-md-4"><label class="form-label">電話</label><input class="form-control" name="phone"></div><div class="col-md-4"><label class="form-label">Email</label><input class="form-control" name="email"></div><div class="col-md-4"><label class="form-label">LINE</label><input class="form-control" name="line"></div></div></section></form><button class="btn btn-link text-secondary mt-3" id="logout">登出</button><div class="alert alert-success mt-3 d-none" id="saved">內容已儲存，請重新整理前台查看。</div></main>
  <script src="admin.js"></script>
</body>
</html>
