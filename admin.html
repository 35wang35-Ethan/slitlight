<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隙光｜內容管理</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f1ed;color:#302923}.login{min-height:100vh;display:grid;place-items:center}.card{border:0;border-radius:18px;box-shadow:0 20px 60px #3b30201b}.sidebar{background:#28231f;color:white;min-height:100vh}.nav-link{color:#cfc5ba}.nav-link.active{color:white;background:#ffffff18}.form-control{padding:.8rem}textarea{min-height:100px}.badge{background:#b59672!important}</style></head><body><div id="login" class="login"><form class="card p-5" style="width:min(430px,92vw)" id="loginForm"><p class="text-secondary small mb-1">SEAM OF LIGHT</p><h1 class="h3 mb-4">內容管理登入</h1><label class="form-label">管理帳號</label><input class="form-control mb-3" id="user" value="admin" required><label class="form-label">密碼</label><input class="form-control mb-4" id="pass" type="password" placeholder="請輸入密碼" required><button class="btn btn-dark w-100 py-3">登入後台</button><p class="small text-secondary mt-3 mb-0">首次登入密碼：seam2026</p></form></div><div id="dashboard" class="d-none"><div class="row g-0"><aside class="col-md-3 col-xl-2 sidebar p-4"><h2 class="h4 mb-5">隙光 CMS</h2><nav class="nav flex-column gap-2"><a class="nav-link active rounded" href="#content">首頁內容</a><a class="nav-link rounded" href="#services">服務項目</a><a class="nav-link rounded" href="#contact">聯絡資料</a><a class="nav-link rounded" href="index.html" target="_blank">預覽網站 ↗</a></nav><button class="btn btn-outline-light btn-sm mt-5" id="logout">登出</button></aside><main class="col-md-9 col-xl-10 p-4 p-lg-5"><div class="d-flex justify-content-between align-items-center mb-5"><div><span class="badge mb-2">已發布</span><h1 class="h3">網站內容管理</h1></div><button class="btn btn-dark px-4" form="cmsForm">儲存並發布</button></div><form id="cmsForm"><section class="card p-4 mb-4" id="content"><h2 class="h5 mb-4">主視覺內容</h2><label class="form-label">主標題（可使用 &lt;br&gt; 換行）</label><textarea class="form-control mb-3" name="heroTitle"></textarea><label class="form-label">說明文字</label><textarea class="form-control" name="heroDesc"></textarea></section><section class="card p-4 mb-4" id="services"><h2 class="h5 mb-4">服務項目</h2><div id="serviceFields"></div></section><section class="card p-4" id="contact"><h2 class="h5 mb-4">聯絡資料</h2><div class="row g-3"><div class="col-md-4"><label>電話</label><input class="form-control" name="phone"></div><div class="col-md-4"><label>Email</label><input class="form-control" name="email"></div><div class="col-md-4"><label>LINE</label><input class="form-control" name="line"></div></div></section></form></main></div></div><div class="toast-container position-fixed bottom-0 end-0 p-3"><div class="toast" id="saved"><div class="toast-body">內容已儲存並發布。</div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="admin.js"></script></body></html>
